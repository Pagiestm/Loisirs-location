vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
        van_image:
            uri_prefix: /images/vans
            upload_destination: "%kernel.project_dir%/public/images/vans"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        van_gallery:
            uri_prefix: /images/vans/gallery
            upload_destination: "%kernel.project_dir%/public/images/vans/gallery"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        quote_response_file:
            uri_prefix: /uploads/quotes
            upload_destination: "%kernel.project_dir%/uploads/quotes"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
