inspiration_title: 'Partez explorer'
inspiration_description: 'Votre van vous attend. À vous de choisir où la route vous mène.'
faq_description: 'Vous avez une question qui ne figure pas ici ? Contactez-nous directement.'
faq_title: "C'est<br> simple,<br> on vous<br> explique."
faq_answer_1: "Remplissez le formulaire de devis avec vos dates et vos besoins. Nous vous répondons sous 24h pour confirmer la disponibilité et vous envoyer un devis personnalisé. Pas d'algorithme — un vrai échange humain."
faq_answer_2: 'Non ! Tout se règle directement à la remise des clés en main propre. Pas de caution en ligne, pas de carte bancaire requise à la réservation. La confiance avant tout.'
faq_answer_3: "Un permis B suffit pour conduire nos vans. Vous aurez besoin de votre permis de conduire, d'une pièce d'identité valide. Nous signons ensemble le contrat de location sur place."
faq_answer_4: 'Absolument. Chaque van est préparé et vérifié avant votre départ : cuisine équipée (réfrigérateur, plaques gaz), literie complète, chauffage autonome et prises 220V. Vous arrivez, vous partez.'
faq_answer_5: 'Bien sûr ! Nos vans peuvent partir partout en France et en Europe. Précisez votre itinéraire dans le formulaire de devis et nous adapterons les conditions en conséquence.'
faq_answer_6: "Nous faisons preuve de souplesse. En cas d'imprévu, contactez-nous le plus tôt possible. Chaque situation est traitée humainement — pas de conditions générales kafkaïennes."
reviews_title: "Ce qu'ils en disent"
