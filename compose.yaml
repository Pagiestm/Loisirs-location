  services:
    database:
      image: mysql:8.0
      environment:
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        MYSQL_ROOT_PASSWORD: root
      ports:
        - "3307:3306"
      volumes:
        - database_data:/var/lib/mysql:rw

    phpmyadmin:
      image: phpmyadmin:latest
      environment:
        PMA_HOST: database
        PMA_USER: ${MYSQL_USER}
        PMA_PASSWORD: ${MYSQL_PASSWORD}
      ports:
        - "8080:80"
      depends_on:
        - database

  volumes:
    database_data:
