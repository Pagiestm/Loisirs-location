name: CD
on:
    push:
        branches: [develop]

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            SSHPASS: ${{ secrets.APP_PASS }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: composer

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Install sshpass
              run: sudo apt-get update && sudo apt-get install -y sshpass

            - name: Build assets and upload (via SCP/SFTP)
              run: |
                  npm install
                  npm run build
                  npm prune --omit=dev
                  tar -czf artifacts.tar.gz node_modules public/build
                  sshpass -e scp -o StrictHostKeyChecking=no artifacts.tar.gz ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}:www/Loisirs-location/

            - name: Deploy to AlwaysData
              run: |
                  sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
                    cd www/Loisirs-location && \
                    git pull origin develop && \
                    tar -xzf artifacts.tar.gz && \
                    rm artifacts.tar.gz && \
                    composer install --no-dev --optimize-autoloader && \
                    php bin/console cache:clear --env=prod --no-debug && \
                    php bin/console doctrine:migrations:sync-metadata-storage --env=prod --no-debug || true && \
                    php bin/console doctrine:migrations:status --env=prod --no-debug || true && \
                    php bin/console doctrine:migrations:migrate -n --env=prod --no-debug\
                  "
