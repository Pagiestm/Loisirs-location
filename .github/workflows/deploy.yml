name: CD
on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.APP_PASS }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Copy built assets to server
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -r public/build ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}:~/www/Loisirs-location/public/

      - name: Deploy to AlwaysData
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} "\
            cd www/Loisirs-location && \
            git pull origin develop && \
            APP_ENV=prod composer install --no-dev --optimize-autoloader && \
            APP_ENV=prod php bin/console cache:clear && \
            APP_ENV=prod php bin/console doctrine:migrations:migrate -n || true\
          "
